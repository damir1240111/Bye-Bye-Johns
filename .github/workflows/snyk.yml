name: "Snyk Dependency Security Scan"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  snyk-scan:
    name: Snyk Dependency Check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      # Scan frontend npm dependencies
      - name: Run Snyk to check npm dependencies
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        continue-on-error: true # Ensure we proceed to upload the results
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk-npm.sarif

      # Scan backend rust cargo dependencies
      - name: Install Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check Rust cargo dependencies
        run: snyk test --file=src-tauri/Cargo.toml --sarif-file-output=snyk-rust.sarif
        continue-on-error: true # Ensure we proceed to upload the results
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Upload results to GitHub Code Scanning
      - name: Upload Snyk NPM results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-npm.sarif
          category: snyk-npm

      - name: Upload Snyk Rust results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-rust.sarif
          category: snyk-rust
